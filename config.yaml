# Global Settings
global:
  output_base_dir: "data/output"
  intermediate_dir: "data/intermediate"
  device: "auto" # "cuda", "cpu", "mps", or "auto"

# Figure Extraction Pipeline
figures:
  step1_tfid:
    enabled: true

  step2_macro:
    model_path: "models/yolo11m-fig-seg-0207-nobreaknocharttext/runs/detect/train/weights/best.pt"
    confidence_threshold: 0.5
    device: "auto"

  step3_micro:
    model_path: "models/yolo11m-fig-scatter-0208/runs/detect/train/weights/best.pt"
    crop_padding: 10
    # OCR: RapidOCR (PP-OCR models in models/rapidocr/), see src/extraction/common/ocr_backend.py;
    # FFTM_OCR_ENGINE=apple switches to Apple Vision (macOS).
    confidence_threshold: 0.5

  step4_assembly:
    clustering_threshold: 0.5

# Table Extraction Pipeline
tables:
  segmentation:
    model_path: "models/yolo11m-tab-seg-0209-white/runs/detect/train/weights/best.pt"
    threshold: 0.8

  molecule_detection:
    model_path: "models/yolo11s-tab-molecule-0207/runs/detect/train/weights/best.pt"
    confidence_threshold: 0.25

  # Table cells are transcribed by the VLM table reader (vlm.table_reader);
  # MolNexTR (auto-loaded from src/extraction/common/molnextr/) owns SMILES.
  scheme_parsing:
    model_path: "models/tab-scheme-seg/best.pt"
    confidence_threshold: 0.3

# LLM (text-in / text-out) — used by Step 5 (Global Assembly) and Step 4.5
# (Local Vars Builder).  Loaded into a frozen Pydantic ``LLMConfig``.
llm:
  # One switch for every LLM / VLM call (record assembly, table reader, chart
  # label reader, figure metadata): gemini | claude | openai.  The key comes
  # from GEMINI_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY.  Override per run
  # with --provider / --model or FFTM_LLM_PROVIDER / FFTM_LLM_MODEL.  A section
  # below may still name its own provider / model.
  # Temperature is sent to Gemini only; current Claude and OpenAI models reject
  # sampling parameters, so their runs are not bit-reproducible (cached
  # responses are).
  provider: "claude"
  models:
    gemini: "gemini-2.5-flash"    # the model behind the published benchmark scores
    claude: "claude-haiku-5-5"    # flowchem-bench 0.876 (Gemini 0.874), about $0.03 per paper
    openai: "gpt-5-nano"          # cheapest OpenAI model (2026-10)

  # Global concurrency cap on LLM calls (single semaphore covering
  # adjudication, inspection, metadata extraction, header judge).
  max_concurrent: 5

  adjudication:
    temperature: 0.0              # greedy decoding (Gemini only): reproducible runs (Zhao 2026-09-21)
    # GlobalAssembly can emit dozens of full reaction records in one call.
    # Two failure modes seen on 2026-06 example.pdf spot-check:
    #   1. 8192 budget → truncated mid-record at row ~10 of Table 1.
    #   2. 32768 budget + default thinking → Gemini 2.5 spent 31k tokens
    #      on internal reasoning and only 1.3k on output, also truncated.
    # Fix: 32k output budget AND thinking_budget=0 (translation task,
    # no chain-of-thought needed for evidence → record formatting).
    max_output_tokens: 32768
    thinking_budget: 0
    max_retries: 3
    timeout_s: 600.0              # a 32k-token answer; Claude's SDK needs an explicit timeout this long

# VLM (text + image) — used by the inspection hooks for paper modules 6 (figure)
# (figure), the chart label reader and the table transcriber.  Loaded into
# frozen Pydantic ``VLMConfig`` subclasses.
vlm:
  # Table transcriber: ONE call per table crop returns caption, scheme
  # conditions, header rows, data rows and footnotes; drawn structures are the
  # token [STRUCTURE] and get their SMILES from MolNexTR by geometric alignment
  # (grid_ops.align_structures). Numbers are cross-checked against the PDF text
  # layer (grid_text_agreement); below min_text_agreement the table is kept but
  # marked parse_status=unverified.
  table_reader:
    temperature: 0.0
    max_output_tokens: 16384      # dense SI tables; thinking_budget 0 so output is not starved
    thinking_budget: 0
    max_retries: 3
    timeout_s: 180.0
    min_text_agreement: 0.6

  # VLM second reader for chart labels: the coordinate mapper tiles every YOLO
  # tick-label / heatmap-cell box into a numbered contact sheet and asks the
  # VLM to transcribe cell #i. OCR and VLM readings are fused deterministically
  # (axis_fit.fuse_*): tick conflicts are settled by the geometric consensus
  # fit, cell-value conflicts by value_conflict_policy. VLM never places points.
  # Env override for evaluation: FFTM_LABEL_READER=off.
  label_reader:
    enabled: true
    value_conflict_policy: "vlm"  # vlm | ocr | null  (when both readers give a valid, different number)
    max_boxes: 80
    temperature: 0.0
    max_output_tokens: 4096
    max_retries: 3
    timeout_s: 120.0

  inspection:
    temperature: 0.0
    max_output_tokens: 8192
    max_retries: 3
    timeout_s: 180.0
    match_threshold: 0.80         # fused report sets review_needed if match_rate falls below

# Adjudication-stage policy knobs (Step 5 source discovery).
adjudication:
  # Figure keyword relevance filter is SOFT: figures lacking result keywords
  # (yield / conversion / selectivity …) are still assembled and only carry
  # ``is_relevant=false`` on their evidence packet.  Set true to drop them
  # from Step 5 entirely (the historical hard-filter behaviour).
  skip_irrelevant_figures: false
  # Design step D: figure records are synthesised by code from raw_data after
  # ONE template call (axis map + series map + shared fields) instead of asking
  # the LLM to transcribe every point.  Set false to restore N-record transcription.
  figure_record_synthesis: true
