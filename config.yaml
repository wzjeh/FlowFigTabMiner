# Global Settings
global:
  output_base_dir: "data/output"
  intermediate_dir: "data/intermediate"
  device: "auto" # "cuda", "cpu", "mps", or "auto"

# Figure Extraction Pipeline
figures:
  step1_tfid:
    enabled: true

  step2_macro:
    model_path: "models/yolo11m-fig-seg-0207-nobreaknocharttext/runs/detect/train/weights/best.pt"
    confidence_threshold: 0.5
    device: "auto"

  step3_micro:
    model_path: "models/yolo11m-fig-scatter-0208/runs/detect/train/weights/best.pt"
    crop_padding: 10
    ocr_engine: "paddle"
    ocr_rec_model: "PP-OCRv4_server_rec"  # rec-only model for tick labels/data values
    confidence_threshold: 0.5

  step4_assembly:
    clustering_threshold: 0.5

# Table Extraction Pipeline
tables:
  segmentation:
    model_path: "models/yolo11m-tab-seg-0209-white/runs/detect/train/weights/best.pt"
    threshold: 0.8

  molecule_detection:
    model_path: "models/yolo11s-tab-molecule-0207/runs/detect/train/weights/best.pt"
    confidence_threshold: 0.25

  structure:
    model_path: "microsoft/table-transformer-structure-recognition-v1.1-all"

  cell_classification:
    model_path: "models/cell_classifier.pt"

  content:
    # MolNexTR is auto-loaded from src/extraction/common/molnextr/
    ocr_engine: "paddle"
    ocr_rec_model: "PP-OCRv4_server_rec"

  scheme_parsing:
    model_path: "models/tab-scheme-seg/best.pt"
    confidence_threshold: 0.3

  header_correction:
    # The VLM provider for header correction is the same one injected for
    # pipeline modules 6/12; only the trigger heuristic lives here.
    enabled: true
    trigger_threshold: 0.5        # row-0 non-empty ratio below this triggers VLM
    send_header_crop_only: false  # send the full table so the VLM sees data rows

# LLM (text-in / text-out) — used by Step 5 (Global Assembly) and Step 4.5
# (Local Vars Builder).  Loaded into a frozen Pydantic ``LLMConfig``.
llm:
  # Global concurrency cap on Gemini calls (single semaphore covering
  # adjudication, inspection, metadata extraction, header judge).
  # Five is comfortable for the free tier (15 RPM); raise for paid tiers.
  max_concurrent: 5

  adjudication:
    provider: "gemini"
    model: "gemini-2.5-flash"     # current stable Gemini Flash; bump to gemini-3.0-flash when GA
    temperature: 0.1
    max_output_tokens: 8192
    max_retries: 3
    timeout_s: 180.0

# VLM (text + image) — used by the inspection hooks for paper modules 6 (figure)
# and 12 (table), plus the table header corrector.  Loaded into a frozen
# Pydantic ``VLMConfig``.
vlm:
  inspection:
    provider: "gemini"
    model: "gemini-2.5-flash"
    temperature: 0.1
    max_output_tokens: 8192
    max_retries: 3
    timeout_s: 180.0
    match_threshold: 0.80         # fused report sets review_needed if match_rate falls below
